daemon off;
error_log stderr;
include /etc/nginx/modules-enabled/*.conf;
pid /tmp/nginx.pid;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  access_log off;
  error_log stderr;
  etag on;
  gzip on;
  gzip_types application/javascript application/json image/svg+xml text/css;
  gzip_vary on;
  index index.html;

  default_type application/octet-stream;
  include /etc/nginx/mime.types;
  sendfile on;
  ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
  ssl_prefer_server_ciphers on;
  tcp_nopush on;
  types_hash_max_size 2048;

  server {
    listen 7060 default_server;
    root /app/static;

    location ~ "^/static/[0-9a-f]+/(.*)$" {
      add_header Cache-Control "public, max-age=31536000, immutable";
      rewrite "^/static/[0-9a-f]+/(.*)$" /$1 break;
    }

    # pkg_tar gives every file a 2000-01-01 mtime, so browsers would otherwise guess these are fresh
    # for years.
    location /static/ {
      add_header Cache-Control "no-cache";
      rewrite ^/static(.*)$ $1 break;
    }
  }

  server {
    listen 7061 default_server;
    root /app/s2;
  }
}
