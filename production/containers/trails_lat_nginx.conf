daemon off;
error_log /dev/stderr;
include /etc/nginx/modules-enabled/*.conf;
pid /tmp/nginx.pid;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  access_log off;
  error_log /dev/stderr;
  etag on;
  gzip on;
  gzip_types application/javascript application/json image/svg+xml text/css;
  gzip_vary on;
  index index.html;

  default_type application/octet-stream;
  include /etc/nginx/mime.types;
  sendfile on;
  ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
  ssl_prefer_server_ciphers on;
  tcp_nopush on;
  types_hash_max_size 2048;

  server {
    listen 7059 default_server;
    root /app;

    # Keep in sync with py/static_prefix.py#HASH_LENGTH
    location ~ "^/static/[0-9a-f]{12}/(.*)$" {
      add_header Cache-Control "public, max-age=31536000, immutable";
      rewrite "^/static/[0-9a-f]{12}/(.*)$" /static/$1 break;
    }

    # pkg_tar gives every file a 2000-01-01 mtime, so browsers would otherwise guess these are fresh
    # for years.
    location /static/ {
      add_header Cache-Control "no-cache";
    }

    location / {
      # Keep in sync with java/lat/trails/frontend/server.ts#BODY_LIMIT_BYTES
      client_max_body_size 64m;
      proxy_http_version 2;
      proxy_pass       http://127.0.0.1:7050;
      proxy_set_header Host $http_host;
    }
  }
}
