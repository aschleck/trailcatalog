syntax = "proto3";

package lat.trails;

option java_multiple_files = true;
option java_package = "lat.trails.proto";

service DataService {
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse);
  rpc GetAviationWeather(GetAviationWeatherRequest) returns (GetAviationWeatherResponse);
  rpc GetCollection(GetCollectionRequest) returns (GetCollectionResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  rpc GetInvite(GetInviteRequest) returns (GetInviteResponse);
  rpc GetOsmTags(GetOsmTagsRequest) returns (GetOsmTagsResponse);
  rpc GetSharing(GetSharingRequest) returns (GetSharingResponse);
  rpc GetTimeZone(GetTimeZoneRequest) returns (GetTimeZoneResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  rpc Save(SaveRequest) returns (SaveResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc SetAnyoneCanView(SetAnyoneCanViewRequest) returns (SetAnyoneCanViewResponse);
  rpc SetGrant(SetGrantRequest) returns (SetGrantResponse);
  rpc SetViewState(SetViewStateRequest) returns (SetViewStateResponse);
  rpc UpdateCollection(UpdateCollectionRequest) returns (UpdateCollectionResponse);
}

// 404s for an invite that expired or was revoked. Accepting one at or below the
// caller's access changes nothing and spends no use.
message AcceptInviteRequest {
  string code = 1;
}

message AcceptInviteResponse {
  string collection_id = 1;
}

message CreateCollectionRequest {
  string name = 1;
  // The collections.schema JSON the collection starts with
  string schema = 2;
}

message CreateCollectionResponse {
  Collection collection = 1;
}

// Only the owner may invite.
message CreateInviteRequest {
  string collection_id = 1;
  // ROLE_READ or ROLE_WRITE
  Role role = 2;
  // Unset never expires.
  optional int64 expires_after_seconds = 3;
}

message CreateInviteResponse {
  Invite invite = 1;
  Sharing sharing = 2;
}

// Only the owner may delete. Everything in the collection goes with it, and nothing is kept to
// restore it from.
message DeleteCollectionRequest {
  string id = 1;
}

message DeleteCollectionResponse {}

// Proxies the Aviation Weather Center, which doesn't allow cross origin requests
message GetAviationWeatherRequest {
  // ICAO id, like KSFO
  string station = 1;
  bool metar = 2;
  bool taf = 3;
}

// Each is unset when it wasn't asked for, or the station has published none recently. Only about a
// fifth of the stations that send METARs issue TAFs.
message GetAviationWeatherResponse {
  Metar metar = 1;
  Taf taf = 2;
}

message AviationCloud {
  // FEW, SCT, BKN, OVC, CLR, or SKC
  string cover = 1;
  // Above ground level, and unset for a clear sky
  optional int32 base_feet = 2;
}

message AviationConditions {
  // Unset when the wind is calm or variable
  optional int32 wind_direction_degrees = 1;
  optional int32 wind_speed_knots = 2;
  optional int32 wind_gust_knots = 3;
  // In statute miles, as reported, so "10+" for ten or more
  string visibility = 4;
  // Present weather in METAR's codes, like "-RA BR"
  string weather = 5;
  repeated AviationCloud clouds = 6;
}

// An observation, sent hourly and in between when the weather changes
message Metar {
  string raw = 1;
  int64 observed_epoch_seconds = 2;
  // VFR, MVFR, IFR, or LIFR, and empty when the report lacks the ceiling or visibility for one
  string flight_category = 3;
  optional double temperature_celsius = 4;
  optional double dewpoint_celsius = 5;
  optional double altimeter_hpa = 6;
  AviationConditions conditions = 7;
}

// A forecast for the five statute miles around an airport, usually for 24 or 30 hours
message Taf {
  string raw = 1;
  int64 issued_epoch_seconds = 2;
  int64 valid_from_epoch_seconds = 3;
  int64 valid_to_epoch_seconds = 4;
  repeated TafPeriod periods = 5;
}

message TafPeriod {
  int64 from_epoch_seconds = 1;
  int64 to_epoch_seconds = 2;
  // Empty for the forecast the TAF opens with, otherwise FM for a lasting change, BECMG for a
  // gradual one, TEMPO for fluctuations, or PROB for a chance of them
  string change = 3;
  // Set for BECMG, as when the change is complete
  optional int64 becoming_epoch_seconds = 4;
  optional int32 probability_percent = 5;
  // Only what the period changes, so a TEMPO often has no wind
  AviationConditions conditions = 6;
}

message GetCollectionRequest {
  string id = 1;
  // Leaves every line, point, and polygon with only its id, data, and version, for listing the
  // features without paying for their geometry.
  bool omit_geometry = 2;
}

message GetCollectionResponse {
  Collection collection = 1;
  repeated Folder folders = 2;
  repeated Line lines = 3;
  repeated Point points = 4;
  // The caller's if they can edit and have saved one, or else the owner's.
  repeated string hidden_feature_ids = 5;
  // JSON from the same view state as hidden_feature_ids, see layer_tree.ts#LayerSettings. Empty
  // means the defaults.
  string layers = 6;
  // JSON with the collection's fields and what styles its features, see
  // schema.ts#CollectionSchema. Empty means the client's default.
  string schema = 7;
  // See Line#version, with 0 for a schema that was never saved.
  int64 schema_version = 8;
  // Only polygons drawn in trails.lat. An imported polygon has no ring to edit, so it only comes
  // from /api/collections/{id}/objects.
  repeated Polygon polygons = 9;
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  // Unset when nobody is signed in.
  optional User user = 1;
}

// Answers anyone with the code, signed in or not, so they can see what they're accepting. 404s like
// AcceptInviteRequest.
message GetInviteRequest {
  string code = 1;
}

message GetInviteResponse {
  string collection_id = 1;
  string collection_name = 2;
  // The display name of whoever created the invite
  string inviter_name = 3;
  // ROLE_READ or ROLE_WRITE
  Role role = 4;
  // The caller's access through their own grant or ownership, unspecified when they have none.
  // Sharing with anyone doesn't count, so that accepting adds the collection to their list.
  Role current_role = 5;
}

// Answers from the latest import, and 404s for an element the import did not keep.
message GetOsmTagsRequest {
  OsmElementType type = 1;
  int64 id = 2;
}

message GetOsmTagsResponse {
  map<string, string> tags = 1;
  // Unset when the import's file carried no metadata
  optional int32 version = 2;
}

enum OsmElementType {
  OSM_ELEMENT_TYPE_UNSPECIFIED = 0;
  OSM_ELEMENT_TYPE_NODE = 1;
  OSM_ELEMENT_TYPE_WAY = 2;
  OSM_ELEMENT_TYPE_RELATION = 3;
}

message GetSharingRequest {
  string collection_id = 1;
}

message GetSharingResponse {
  Sharing sharing = 1;
}

message GetTimeZoneRequest {
  double lat_degrees = 1;
  double lng_degrees = 2;
}

message GetTimeZoneResponse {
  // A tzdb id like America/Los_Angeles, or Etc/GMT+8 at sea
  string zone = 1;
}

message ListCollectionsRequest {}

message ListCollectionsResponse {
  // Owned by the caller
  repeated Collection collections = 1;
  // Granted to the caller, not to anyone
  repeated Collection shared = 2;
}

// Only the owner may revoke. Whoever already accepted keeps their grant.
message RevokeInviteRequest {
  string code = 1;
}

message RevokeInviteResponse {
  Sharing sharing = 1;
}

// Finds boundaries, trails, and points by name. Of two results that match equally well, the one
// nearer the center ranks first.
message SearchRequest {
  string query = 1;
  double center_lat_degrees = 2;
  double center_lng_degrees = 3;
  // How far the map reaches from its center, so that zooming out widens what counts as near
  double radius_meters = 4;
}

message SearchResponse {
  // Best first
  repeated SearchResult results = 1;
}

message SearchResult {
  SearchResultKind kind = 1;
  int64 id = 2;
  string name = 3;
  // A RelationCategory for a boundary or a trail and a PointCategory for a point
  int32 type = 4;
  // The name the query matched when that isn't name, like an airport's code or a translation
  string matched_name = 5;
  // The names of the boundaries around it, smallest first
  repeated string within = 6;
  // Where to move the camera. A point's low and high are both where it is.
  double low_lat_degrees = 7;
  double low_lng_degrees = 8;
  double high_lat_degrees = 9;
  double high_lng_degrees = 10;
}

enum SearchResultKind {
  SEARCH_RESULT_KIND_UNSPECIFIED = 0;
  SEARCH_RESULT_KIND_BOUNDARY = 1;
  SEARCH_RESULT_KIND_POINT = 2;
  SEARCH_RESULT_KIND_TRAIL = 3;
}

// Writes apply in order in one transaction, so a batch lands whole or not at all. Any stale
// version is a 409 for the entire batch.
message SaveRequest {
  string collection_id = 1;
  repeated Write writes = 2;
}

// The client picks ids so that a retried put replaces the feature instead of adding another.
message Write {
  oneof write {
    Folder put_folder = 1;
    Line put_line = 2;
    Point put_point = 3;
    Delete delete = 4;
    PutSchema put_schema = 5;
    Polygon put_polygon = 6;
  }
}

// Replaces the collection's schema, see GetCollectionResponse#schema.
message PutSchema {
  string schema = 1;
  // A stale version is a 409, as for a feature.
  int64 version = 2;
}

message Delete {
  FeatureKind kind = 1;
  string id = 2;
  // A stale version is a 409. Deleting an already deleted feature succeeds whatever this says.
  int64 base_version = 3;
}

enum FeatureKind {
  FEATURE_KIND_UNSPECIFIED = 0;
  FEATURE_KIND_FOLDER = 1;
  FEATURE_KIND_LINE = 2;
  FEATURE_KIND_POINT = 3;
  FEATURE_KIND_POLYGON = 4;
}

// Only the owner may change who can view.
message SetAnyoneCanViewRequest {
  string collection_id = 1;
  bool anyone_can_view = 2;
}

message SetAnyoneCanViewResponse {
  Sharing sharing = 1;
}

// Only the owner may change a grant. Invites are the only way to add one, so this 404s for a user
// the collection isn't shared with.
message SetGrantRequest {
  string collection_id = 1;
  string user_id = 2;
  // ROLE_READ or ROLE_WRITE, or ROLE_UNSPECIFIED to stop sharing with them
  Role role = 3;
}

message SetGrantResponse {
  Sharing sharing = 1;
}

// Only someone who can edit may save a view state. Viewers start from the owner's.
message SetViewStateRequest {
  string collection_id = 1;
  // Replaces what the caller had hidden before.
  repeated string hidden_feature_ids = 2;
  // Replaces the caller's layers as well, see GetCollectionResponse#layers.
  string layers = 3;
}

message SetViewStateResponse {}

// Anyone who can edit the collection may update it.
message UpdateCollectionRequest {
  string id = 1;
  optional string name = 2;
  // Merged into Collection#data, where a null removes its key
  string data = 3;
}

message UpdateCollectionResponse {
  Collection collection = 1;
}

// Every sharing change answers with this, so the share dialog shows what actually saved.
message Sharing {
  bool anyone_can_view = 1;
  repeated Grant grants = 2;
  // The ones that can still be accepted, newest first
  repeated Invite invites = 3;
}

message Grant {
  string user_id = 1;
  // ROLE_READ or ROLE_WRITE
  Role role = 2;
  string display_name = 3;
  // Empty when their login didn't share one
  string email = 4;
}

// Ordered by how much each allows, because AcceptInvite and the invite page compare them.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_READ = 1;
  ROLE_WRITE = 2;
  ROLE_OWNER = 3;
}

message SaveResponse {
  // Stamped onto everything the batch wrote. Send it back on the next edit of any of them.
  int64 version = 1;
}

message Collection {
  string id = 1;
  string name = 2;
  // Bumped once per write, and stamped onto whatever the write touched.
  int64 version = 3;
  // The caller's
  Role role = 4;
  string data = 5;
}

message Folder {
  string id = 1;
  // The jsonb column verbatim. A folder_id key nests it in another folder.
  string data = 2;
  // See Line#version.
  int64 version = 3;
}

message Invite {
  string code = 1;
  // ROLE_READ or ROLE_WRITE
  Role role = 2;
  int32 uses = 3;
  // Unset never expires.
  optional int64 expires_epoch_ms = 4;
}

message Line {
  string id = 1;
  // The jsonb column verbatim, the same string /api/collections/{id}/objects writes.
  string data = 2;
  // Interleaved lat then lng.
  repeated sint32 lat_lng_e7 = 3;
  // Empty, or one per point.
  repeated sint32 elevation_centimeters = 4;
  // Empty, or one per point.
  repeated int64 time_seconds = 5;
  // The collection version this line was last written at, 0 for a line the server has not seen.
  int64 version = 6;
}

message Point {
  string id = 1;
  // The jsonb column verbatim.
  string data = 2;
  sint32 lat_e7 = 3;
  sint32 lng_e7 = 4;
  optional sint32 elevation_centimeters = 5;
  // See Line#version.
  int64 version = 6;
}

message Polygon {
  string id = 1;
  // The jsonb column verbatim.
  string data = 2;
  // One ring, interleaved lat then lng, without the first point repeated at the end. It may wind
  // either way and cross itself, and fills wherever an odd number of its turns enclose.
  repeated sint32 lat_lng_e7 = 3;
  // See Line#version.
  int64 version = 4;
}

message User {
  string id = 1;
  string display_name = 2;
  optional string picture_url = 3;
}

